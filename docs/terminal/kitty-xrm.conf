# Optional, separate XRM terminal profile. Does not modify ~/.config/kitty.
# Install Maple Mono NF CN first; emoji use the terminal/OS fallback fonts.
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
background #131a23
foreground #dce3eb
cursor #73c2e6
selection_background #233749
selection_foreground #dce3eb
enable_audio_bell no
